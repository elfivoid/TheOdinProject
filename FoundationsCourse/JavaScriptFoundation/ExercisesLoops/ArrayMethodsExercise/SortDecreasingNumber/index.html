<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />

    <title>Sort in Decreasing Order</title>

    <style>
      html {
        font-family: sans-serif;
      }
      body {
        width: 50%;
        max-width: 800px;
        min-width: 480px;
        margin: 0 auto;
      }
      .lastResult {
        color: white;
        padding: 3px;
      }
    </style>
  </head>

  <body>

    <script>

let arr = [5, 2, 1, -10, 8];

// ... your code to sort it in decreasing order

arr.sort(function(a, b) { return b - a;});
// or shorter with arrow function: arr.sort((a, b) => b - a); 
alert( arr ); // 8, 5, 2, 1, -10
    </script>
  </body>
</html>
